<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Week 6 - DOM & Fetch API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tugas Week 6: Pemesanan & Daftar Produk</h1>

     
        <section class="form-section">
            <h2>Formulir Pemesanan Produk</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda">
                </div>
                
                <div class="form-group">
                    <label for="email">Alamat Email:</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda">
                </div>

                <button type="submit">Kirim Pesanan</button>
            </form>
        
            <div id="formFeedback" class="feedback-message"></div>
        </section>

        <hr>


        <section class="fetch-section">
            <h2>Daftar Produk (Fetch API)</h2>
            
       
            <div id="loading" class="status-message">Memuat data produk...</div>
            <div id="error" class="status-message error-text" style="display: none;"></div>
            
        
            <div id="productList" class="product-grid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
